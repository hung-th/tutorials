<style>
:root{--ink:#1d2329;--muted:#5b6670;--line:#dfe3e6;--bg:#fbfaf7;--teal:#0f7b72;--violet:#6a4c9c;--warn:#a4561b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.65 "IBM Plex Sans",system-ui,sans-serif}
main{max-width:820px;margin:0 auto;padding:48px 24px 96px}
.badge{display:inline-block;font:500 12px "IBM Plex Mono",monospace;letter-spacing:.06em;text-transform:uppercase;color:#fff;background:var(--warn);padding:3px 9px;border-radius:3px}
h1,h2,h3{font-family:Newsreader,Georgia,serif;font-weight:600;line-height:1.25}
h1{font-size:2.1rem;margin:.6em 0 .4em}h2{font-size:1.55rem;margin-top:2.2em;padding-top:.6em;border-top:2px solid var(--teal);color:var(--teal)}
h3{font-size:1.2rem;margin-top:1.8em}
a{color:var(--teal)}strong{font-weight:600}
table{border-collapse:collapse;width:100%;margin:1em 0;font-size:.93rem}th,td{border:1px solid var(--line);padding:7px 10px;text-align:left;vertical-align:top}th{background:#eef4f3}
li{margin:.25em 0}code{font-family:"IBM Plex Mono",monospace}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.9rem;color:var(--muted)}
@media print{.top a{display:none}}

#gate{max-width:420px;margin:18vh auto;padding:32px;background:#fff;border:1px solid var(--line);border-radius:8px}
#gate h1{font-size:1.5rem;margin-top:.4em}#gate p{color:var(--muted);font-size:.95rem}
#gate input{width:100%;padding:10px 12px;font:inherit;border:1px solid var(--line);border-radius:5px;margin:8px 0}
#gate button{padding:9px 18px;font:500 15px "IBM Plex Sans",sans-serif;background:var(--teal);color:#fff;border:0;border-radius:5px;cursor:pointer}
#err{color:var(--warn);min-height:1.4em;font-size:.9rem}
</style>

const b=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function open_(pw){
  const base=await crypto.subtle.importKey("raw",new TextEncoder().encode(pw),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey({name:"PBKDF2",salt:b(P.salt),iterations:P.iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b(P.iv)},key,b(P.ct));
  return new TextDecoder().decode(pt);
}
async function show(pw,remember){
  const h=await open_(pw);
  const m=document.getElementById("content"); m.innerHTML=h; m.hidden=false;
  document.getElementById("gate").remove();
  if(remember){try{sessionStorage.setItem("tutorpw",pw)}catch(e){}}
}
document.getElementById("gate").addEventListener("submit",async e=>{
  e.preventDefault(); const err=document.getElementById("err"); err.textContent="Checking…";
  try{await show(document.getElementById("pw").value,true)}catch(x){err.textContent="That password didn't work."}
});
(async()=>{let s=null;try{s=sessionStorage.getItem("tutorpw")}catch(e){} if(s){try{await show(s,false)}catch(e){}}})();
</script>
